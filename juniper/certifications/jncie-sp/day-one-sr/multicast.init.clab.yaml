name: day-one-sr
prefix: ""
topology:
  groups:
    junos:
      kind: juniper_vjunosrouter
      image: vjunos-router:25.4R1.12
    ceos:
      kind: arista_ceos
      image: ceos:4.34.0F
    iol:
      kind: cisco_iol
      image: cisco_iol:17.12.01
  nodes:
    R1:
      group: junos
      startup-config: configs/R1/multicast.init.cfg
    R2:
      group: junos
      startup-config: configs/R2/multicast.init.cfg
    R3:
      group: junos
      startup-config: configs/R3/multicast.init.cfg
    R4:
      group: junos
      startup-config: configs/R4/multicast.init.cfg
    R5:
      group: junos
      startup-config: configs/R5/multicast.init.cfg
    R6:
      group: junos
      startup-config: configs/R6/multicast.init.cfg
    R7:
      group: junos
      startup-config: configs/R7/multicast.init.cfg
    R8:
      group: junos
      startup-config: configs/R8/multicast.init.cfg
    R9:
      group: junos
      startup-config: configs/R9/multicast.init.cfg
    CE1:
      group: iol
      startup-config: configs/CE1/multicast.cfg.partial
    CE2:
      group: iol
      startup-config: configs/CE2/multicast.cfg.partial
    CE3:
      group: iol
      startup-config: configs/CE3/multicast.cfg.partial
    CE4:
      group: iol
      startup-config: configs/CE4/multicast.cfg.partial
    CE5:
      group: iol
      startup-config: configs/CE5/multicast.cfg.partial
    CE6:
      group: iol
      startup-config: configs/CE6/multicast.cfg.partial
  links:
    - endpoints: ["R1:ge-0/0/0", "R2:ge-0/0/0"]
    - endpoints: ["R1:ge-0/0/1", "R4:ge-0/0/1"]
    - endpoints: ["R1:ge-0/0/2", "R3:ge-0/0/2"]
    - endpoints: ["R2:ge-0/0/1", "R5:ge-0/0/1"]
    - endpoints: ["R4:ge-0/0/0", "R5:ge-0/0/0"]
    - endpoints: ["R4:ge-0/0/2", "R6:ge-0/0/2"]
    - endpoints: ["R4:ge-0/0/3", "R6:ge-0/0/3"]
    - endpoints: ["R5:ge-0/0/2", "R7:ge-0/0/2"]
    - endpoints: ["R5:ge-0/0/3", "R7:ge-0/0/3"]
    - endpoints: ["R6:ge-0/0/0", "R7:ge-0/0/0"]
    - endpoints: ["R6:ge-0/0/1", "R8:ge-0/0/1"]
    - endpoints: ["R6:ge-0/0/4", "R3:ge-0/0/4"]
    - endpoints: ["R7:ge-0/0/1", "R9:ge-0/0/1"]
    - endpoints: ["R8:ge-0/0/0", "R9:ge-0/0/0"]
    - endpoints: ["CE1:Ethernet0/1", "R1:ge-0/0/3"]
    - endpoints: ["CE2:Ethernet0/1", "R1:ge-0/0/4"]
    - endpoints: ["CE2:Ethernet0/2", "R2:ge-0/0/4"]
    - endpoints: ["CE3:Ethernet0/1", "R2:ge-0/0/3"]
    - endpoints: ["CE4:Ethernet0/1", "R8:ge-0/0/2"]
    - endpoints: ["CE5:Ethernet0/1", "R8:ge-0/0/3"]
    - endpoints: ["CE5:Ethernet0/2", "R9:ge-0/0/3"]
    - endpoints: ["CE6:Ethernet0/1", "R9:ge-0/0/2"]
