chassis {
    fpc 0 {
        pic 0 {
            tunnel-services;
        }
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.0.20/31;
            }
            family inet6;
            family iso;
            family mpls;
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 10.0.0.17/31;
            }
            family inet6;
            family iso;
            family mpls;
        }
    }
    ge-0/0/2 {
        unit 0 {
            family inet {
                address 10.8.14.8/24;
            }
            family inet6 {
                address 2001:10:8:14::8/64;
            }
            family mpls;
        }
    }
    ge-0/0/3 {
        unit 0 {
            family inet {
                address 10.8.15.8/24;
            }
            family inet6 {
                address 2001:10:8:15::8/64;
            }
            family mpls;
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.168.0.8/32;
            }
            family inet6 {
                address fec0:0:0:1111::8/128;
            }
            family iso {
                address 49.0001.0000.0000.0008.00;
            }
            family mpls;
        }
    }
}
protocols {
    isis {                              
        interface ge-0/0/0.0 {
            point-to-point;
        }
        interface ge-0/0/1.0 {
            point-to-point;
        }
        interface lo0.0 {
            passive;
        }
        level 1 disable;
        level 2 wide-metrics-only;
    }
    pim {
        interface ge-0/0/2.0;
        interface ge-0/0/3.0;
        interface lo0.0;
    }
    ldp {
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
        interface lo0.0;
    }
    bgp {
        group PE-MESH {
            type internal;
            peer-as 100;
            export EXPORT-STATIC;
            local-address 192.168.0.8;
            neighbor 192.168.0.1;
            neighbor 192.168.0.2;
            neighbor 192.168.0.9;
        }
    }
}
policy-options {
    policy-statement EXPORT-STATIC {
        term 1 {
            from protocol static;
            then next-hop self;
            then accept;
        }
    }
}
routing-options {
    autonomous-system 100;
    static {
        route 172.16.0.4/32 next-hop 10.8.14.14;
        route 172.16.0.5/32 next-hop 10.8.15.15;
    }
}
